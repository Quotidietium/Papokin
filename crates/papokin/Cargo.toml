[package]
name = "papokin"
version.workspace = true
description = "Empowering everyone to host fast and efficient Minecraft servers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "papokin"

[package.metadata.tauri-winres]
# FileDescription is handled as the Program name by Windows!
FileDescription = "Pumpkin"
OriginalFilename = "papokin.exe"
LegalCopyright = "Copyright © 2026 Aleksander Medvedev"

# Required to expose papokin plugin API
[lib]
doctest = false

[dependencies]
# papokin
arc-swap.workspace = true
rayon.workspace = true
papokin-util.workspace = true
papokin-nbt.workspace = true
papokin-config.workspace = true
papokin-command.workspace = true
papokin-inventory.workspace = true
papokin-world.workspace = true
papokin-data = { workspace = true, features = ["default"] }
papokin-protocol = { workspace = true, features = ["default"] }
papokin-macros.workspace = true
papokin-plugin-runtime.workspace = true
papokin-gametest = { path = "../papokin-gametest" }
papokin-host-bindings.workspace = true

dashmap.workspace = true
crossbeam.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = [
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "io-std",
    "signal",
    "fs",
    "io-util",
    "time",
] }
thiserror.workspace = true
futures.workspace = true
notify.workspace = true

# config
serde.workspace = true
serde_repr.workspace = true
serde_json.workspace = true
toml.workspace = true

colored.workspace = true

bytes.workspace = true

rand.workspace = true

num-bigint.workspace = true

# Console line reading
rustyline.workspace = true

# encryption
rsa.workspace = true

# verification & WASM parsing
ed25519-dalek.workspace = true
hex.workspace = true
wasmparser.workspace = true
wasm-encoder.workspace = true

# authentication
reqwest = { workspace = true, features = ["json"] }
rustls.workspace = true

sha1.workspace = true

# velocity en
hmac.workspace = true
sha2.workspace = true

base64.workspace = true

# logging
tracing.workspace = true
tracing-subscriber.workspace = true

time = { workspace = true, features = ["parsing", "macros", "local-offset"] }

# plugins
libloading.workspace = true
rustc-hash.workspace = true

# Task handling
tokio-util = { workspace = true, features = ["rt"] }

# System details & Rustc version
libc = { workspace = true }
sysinfo.workspace = true
rustc_version_runtime.workspace = true

flate2.workspace = true
console-subscriber = { workspace = true, optional = true }

wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
wasmtime-wasi-http = { workspace = true }
hyper = { workspace = true }
axum.workspace = true
webpki-root-certs.workspace = true
async-trait.workspace = true

ordered-float.workspace = true

postcard = { workspace = true }
tracing-serde-structured = { workspace = true }

bitflags = { workspace = true }
image = { version = "0.25.10", default-features = false, features = ["png"] }

indexmap.workspace = true


[dev-dependencies]
tempfile.workspace = true

[features]
console-subscriber = ["dep:console-subscriber"]

[lints]
workspace = true
