[package]
name = "papokin-benchmark"
version = "0.0.0"
edition = "2024"
publish = false
description = "Papokin 性能基准程序（内存/CPU 量化对比，报告输出至 note/report/perf/）"

[dependencies]
papokin-world = { path = "../crates/papokin-world" }
papokin-data = { path = "../crates/papokin-data" }
papokin-nbt = { path = "../crates/papokin-nbt" }
papokin-config = { path = "../crates/papokin-config" }
papokin-util = { path = "../crates/papokin-util" }
papokin-protocol = { path = "../crates/papokin-protocol" }
bytes = { workspace = true }
arc-swap.workspace = true
flate2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
sysinfo = { workspace = true }

[lints]
workspace = true
