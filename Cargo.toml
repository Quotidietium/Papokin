[workspace]
resolver = "3"
members = [
    "crates/papokin",
    "crates/papokin-api-macros",
    "crates/papokin-codecs",
    "crates/papokin-command",
    "crates/papokin-config",
    "crates/papokin-data",
    "crates/papokin-gametest",
    "crates/papokin-inventory",
    "crates/papokin-macros",
    "crates/papokin-nbt",
    "crates/papokin-plugin-api",
    "crates/papokin-plugin-runtime",
    "crates/papokin-plugin-utils",
    "crates/papokin-protocol",
    "crates/papokin-util", 
    "crates/papokin-host-bindings",
    "crates/papokin-world",
    "tools/papokin-codegen",
    "tools/papokin-fuzzer",
]

# [workspace.lints.rust]
# missing_docs = "warn"

[workspace.lints.clippy]
# Groups
all = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

if_then_some_else_none = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
separated_literal_suffix = "deny"
semicolon_outside_block = "deny"
redundant_test_prefix = "deny"
non_zero_suggestions = "deny"
dbg_macro = "deny"
rc_buffer = "deny"
verbose_file_reads = "deny"
string_lit_chars_any = "deny"
use_self = "deny"
useless_let_if_seq = "deny"
branches_sharing_code = "deny"
equatable_if_let = "deny"
option_if_let_else = "deny"
needless_pass_by_ref_mut = "deny"
needless_collect = "deny"
redundant_clone = "deny"
set_contains_or_insert = "deny"
significant_drop_in_scrutinee = "deny"
print_stdout = "deny"
print_stderr = "deny"

todo = "deny"
unreachable = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Safety & Soundness
undocumented_unsafe_blocks = "deny"
uninit_assumed_init = "deny"
uninit_vec = "deny"
cast_ptr_alignment = "deny"
ptr_as_ptr = "deny"

# Production Quality & Best Practices
fallible_impl_from = "deny"
mut_mut = "deny"
char_lit_as_u8 = "deny"
match_wild_err_arm = "deny"
invalid_upcast_comparisons = "deny"

# Expected/Allowed
clone_on_ref_ptr = "allow"

# Expected/Allowed
cargo_common_metadata = "allow"
cast_precision_loss = "allow"
multiple_crate_versions = "allow"
single_call_fn = "allow"
similar_names = "allow"
unreadable_literal = "allow"
many_single_char_names = "allow"
suboptimal_flops = "allow"
cast_lossless = "allow"
while_float = "allow"
or_fun_call = "allow"
significant_drop_tightening = "allow"
suspicious_operation_groupings = "allow"
literal_string_with_formatting_args = "allow"
future_not_send = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
unused_async_trait_impl = "allow"

[workspace.package]
version = "0.3.0+1.21.11"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0"

[profile.release]
lto = true
strip = "debuginfo"
codegen-units = 1

[profile.bench]
debug = true

[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.dev]
debug = false

[workspace.dependencies]
tokio = { version = "1.53", default-features = false }
syn = { version = "3.0", default-features = false, features = ["full", "parsing", "printing", "proc-macro", "clone-impls", "derive"] }

thiserror = { version = "2.0", default-features = false }

bytes = { version = "1.12", default-features = false, features = ["serde", "std"] }

# Concurrency/Parallelism and Synchronization
futures = { version = "0.3", default-features = false, features = ["std"] }
rayon = { version = "1.12", default-features = false }
crossbeam = { version = "0.8", default-features = false, features = ["std"] }

uuid = { version = "1.26", default-features = false, features = ["serde", "v3", "v4", "std"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_repr = { version = "0.1", default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

tempfile = { version = "3.27.0", default-features = false }
proc-macro-error2 = { version = "2", default-features = false }
aes = { version = "0.9", default-features = false }
async-compression = { version = "0.4.46", default-features = false }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bitflags = { version = "2.13.2", default-features = false, features = ["std"] }
cesu8 = { version = "1.1", default-features = false }
cfb8 = { version = "0.9", default-features = false }
colored = { version = "3.1", default-features = false }
console-subscriber = { version = "0.5.0", default-features = false }
crc-fast = { version = "1.10.0", default-features = false, features = ["std"] }
criterion = { version = "0.8", default-features = false }
crypto-bigint = { version = "0.7.5", default-features = false }
dashmap = { version = "6.2", default-features = false }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
heck = { version = "0.5", default-features = false }
hmac = { version = "=0.13.0", default-features = false }
indexmap = { version = "2.14", default-features = false, features = ["std"] }
itertools = { version = "0.15.0", default-features = false, features = ["use_std"] }
libc = { version = "0.2", default-features = false }
libloading = { version = "0.9", default-features = false, features = ["std"] }
lru = { version = "0.18.4", default-features = false }
lz4-java-wrc = { version = "0.2.0", default-features = false, features = ["lz4_flex"] }
md5 = { version = "0.8", default-features = false }
num-bigint = { version = "0.5", default-features = false, features = ["std"] }
num-derive = { version = "0.5", default-features = false }
num-traits = { version = "0.2", default-features = false, features = ["std"] }
phf = { version = "0.14.0", default-features = false, features = ["std"] }
proc-macro2 = { version = "1.0", default-features = false, features = ["proc-macro"] }
papokin-api-macros = { path = "crates/papokin-api-macros", default-features = false }
papokin-codecs = { path = "crates/papokin-codecs", default-features = false }
papokin-command = { path = "crates/papokin-command", default-features = false }
papokin-config = { path = "crates/papokin-config", default-features = false }
papokin-data = { path = "crates/papokin-data", default-features = false }
papokin-inventory = { path = "crates/papokin-inventory", default-features = false }
papokin-macros = { path = "crates/papokin-macros", default-features = false }
papokin-nbt = { path = "crates/papokin-nbt", default-features = false }
papokin-plugin-api = { path = "crates/papokin-plugin-api", default-features = false }
papokin-plugin-runtime = { path = "crates/papokin-plugin-runtime", default-features = false }
papokin-plugin-utils = { path = "crates/papokin-plugin-utils", default-features = false }
papokin-protocol = { path = "crates/papokin-protocol", default-features = false }
papokin-util = { path = "crates/papokin-util", default-features = false }
papokin-host-bindings = { path = "crates/papokin-host-bindings", default-features = false }
papokin-world = { path = "crates/papokin-world", default-features = false }
quote = { version = "1.0", default-features = false, features = ["proc-macro"] }
rand = { version = "0.10.2", default-features = false, features = ["std", "std_rng", "thread_rng"] }
rsa = { version = "=0.10.0-rc.18", default-features = false, features = ["std", "encoding"] }
ed25519-dalek = { version = "3.0", default-features = false, features = ["fast"] }
hex = { version = "0.4", default-features = false, features = ["std"] }
rustc-hash = { version = "2.1.3", default-features = false, features = ["std"] }
rustyline = { version = "18.0.1", default-features = false, features = ["with-file-history"] }
ruzstd = { version = "0.9.0", default-features = false, features = ["std"] }
sha1 = { version = "=0.11.0", default-features = false, features = ["oid"] }
sha2 = { version = "=0.11.0", default-features = false, features = ["oid"] }
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
    "time",
    "std",
] }
slotmap = { version = "1.1", default-features = false, features = ["std"] }
time = { version = "0.3", default-features = false, features = ["std"] }
arc-swap = { version = "1.9", default-features = false }
tokio-util = { version = "0.7.19", default-features = false }
toml = { version = "1.1", default-features = false, features = ["parse", "display", "serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }

sysinfo = { version = "0.39", default-features = false, features = ["system"] }
rustc_version_runtime = { version = "0.3", default-features = false }
ordered-float = { version = "5.4", default-features = false, features = ["std"] }

# Temporary pin to the approved implementation of Component Model sync reentry:
# https://github.com/bytecodealliance/wasmtime/commit/f6b3140dbb1d9b436ef523d14740292c956b0364
wasmtime = { git = "https://github.com/bytecodealliance/wasmtime", rev = "f6b3140dbb1d9b436ef523d14740292c956b0364", default-features = false, features = ["runtime", "component-model", "component-model-async", "async", "cache", "cranelift", "gc", "gc-drc", "threads", "std"] }
wasmtime-wasi = { git = "https://github.com/bytecodealliance/wasmtime", rev = "f6b3140dbb1d9b436ef523d14740292c956b0364", default-features = false, features = ["p2", "p3"] }
wasmtime-wasi-http = { git = "https://github.com/bytecodealliance/wasmtime", rev = "f6b3140dbb1d9b436ef523d14740292c956b0364", default-features = false, features = ["p2", "p3", "default-send-request"] }
# needed for interacting with wasmtime-wasi-http - keep in sync
hyper = { version = "^1.11", default-features = false }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
async-trait = "0.1"
wit-bindgen = { version = "0.61", default-features = false, features = ["macros"] }

postcard = { version = "1.1", default-features = false, features = ["alloc"] }
tracing-serde-structured = { version = "0.4", default-features = false }
wasmparser = { version = "0.258", default-features = false }
wasm-encoder = { version = "0.258", default-features = false, features = ["component-model", "std"] }
webpki-root-certs = { version = "1.0.9", default-features = false }
# ring-only: must match the provider the rest of the tree (wasmtime-wasi-http, rtc) uses
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
